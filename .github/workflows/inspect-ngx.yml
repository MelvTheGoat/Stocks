name: inspect-ngx

# A one-off investigation, not a collector.
#
# NGX's firewall serves the development container a bot challenge, so from
# there the terms of use cannot be read and the price list cannot be seen. An
# Actions runner is served the real pages. This reads them once, prints what
# the terms say about automated access, and uploads the price list page as an
# artifact so a parser can be written against the real structure instead of a
# guess at it.

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/inspect_ngx.py"
      - ".github/workflows/inspect-ngx.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # brotli and zstd decoders, so a compressed reply cannot come out as
      # binary noise. The script also asks only for gzip and deflate; both
      # belts, because a silent decode failure looked exactly like a readable
      # page the first time round.
      - run: pip install "httpx[brotli,zstd]"

      - name: Read the pages
        run: python scripts/inspect_ngx.py

      - name: Keep the captured page
        uses: actions/upload-artifact@v4
        with:
          name: ngx-capture
          path: ngx-capture/
          if-no-files-found: warn
          retention-days: 7
