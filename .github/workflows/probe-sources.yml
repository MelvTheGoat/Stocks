name: probe-sources

# Run by hand from the Actions tab. Answers two questions that cannot be
# answered from a development container: whether an Actions runner gets past
# the NGX bot challenge, and whether Stooq is reachable from here.
#
# One request per source, nothing collected, nothing stored.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install httpx

      - name: Probe
        run: python scripts/probe_sources.py
