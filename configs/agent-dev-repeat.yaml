name: agent-dev-repeat
description: >
  The same job as agent-dev with a different sampling seed. The gap between the
  two is run-to-run noise, which is what a two-point difference elsewhere has to
  beat before it means anything.

model:
  name: Qwen/Qwen2.5-7B-Instruct-AWQ
  hf_repo: Qwen/Qwen2.5-7B-Instruct-AWQ
  quantization: awq
  dtype: float16
  max_model_len: 8192
  temperature: 0.0
  max_tokens: 700
  seed: 1

eval:
  split: dev
  version: v1
  as_of: "2026-09-29"
  limit: null

agent:
  kind: agent
  max_steps: 8
  tools: []        # empty means the full set
  self_check: false

seed: 1
