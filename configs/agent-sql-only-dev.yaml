name: agent-sql-only-dev
description: >
  Experiment B, arm two: the model writes its own SQL instead of using
  purpose-built lookups. Same data, different interface.

model:
  name: Qwen/Qwen2.5-7B-Instruct-AWQ
  hf_repo: Qwen/Qwen2.5-7B-Instruct-AWQ
  quantization: awq
  dtype: float16
  max_model_len: 8192
  temperature: 0.0
  max_tokens: 700
  seed: 0

eval:
  split: dev
  version: v1
  as_of: "2026-09-29"
  limit: null

agent:
  kind: agent
  max_steps: 8
  tools: [run_sql, calculate]
  self_check: false

seed: 0
