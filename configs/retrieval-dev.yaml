name: retrieval-dev
description: >
  Baseline B: one BM25 search over the corpus, then one answer citing what it
  found. No loop and no tools. This is where most demos stop, which makes it
  the honest thing to compare an agent against.

model:
  name: Qwen/Qwen2.5-7B-Instruct-AWQ
  hf_repo: Qwen/Qwen2.5-7B-Instruct-AWQ
  quantization: awq
  dtype: float16
  max_model_len: 8192
  temperature: 0.0
  max_tokens: 700
  seed: 0

eval:
  split: dev
  version: v1
  as_of: "2026-09-29"
  limit: null

agent:
  kind: retrieval
  max_steps: 1

seed: 0
