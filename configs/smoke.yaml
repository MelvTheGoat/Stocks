name: smoke
description: >
  Tiny run that proves the pipeline works end to end on the GPU box: vLLM
  starts, the client reaches it, a few questions get asked and graded, and the
  results reach the results branch. Not a measurement of anything.

model:
  # Candidate pick. 4-bit AWQ weights for a 7B model are roughly 5 GB, which
  # leaves room for the KV cache inside a 16 GB T4. The final choice and its
  # justification are settled in Phase 5, against the vLLM version that
  # actually starts on Kaggle.
  name: Qwen/Qwen2.5-7B-Instruct-AWQ
  hf_repo: Qwen/Qwen2.5-7B-Instruct-AWQ
  quantization: awq
  dtype: float16
  max_model_len: 4096
  temperature: 0.0
  max_tokens: 256

eval:
  split: dev
  version: v0-smoke
  as_of: "2026-09-26"
  limit: 5

agent:
  kind: closed_book
  max_steps: 1

seed: 0
